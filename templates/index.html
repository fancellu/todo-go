<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" integrity="sha384-nWN3KqaaVcbEsCjLSV+2jMjh62Iny/+mN3srM8TZeM8N6aj7eDl5wwYggjAJ4/sJ" crossorigin="anonymous">
    <style>
        body.dark {
            background-color: #343a40;
            color: #f8f9fa;
        }
        body.dark .list-group-item {
            background-color: #495057;
            color: #f8f9fa;
        }
        body.dark #theme-toggle {
            --bs-btn-color: #f8f9fa;
            --bs-btn-border-color: #adb5bd;
        }
    </style>
</head>
<body>
    <div class="container mt-5 position-relative">       
        <div class="position-absolute top-0 end-0 mt-3 me-3">            
            <button id="theme-toggle" class="btn btn-outline-secondary" aria-label="Toggle theme">
                <i id="theme-icon" class="bi bi-brightness-high-fill" style="font-size: 20px;"></i>
            </button>
        </div>
        <h1 class="text-center mb-4">My Todo List</h1>

        <ul class="list-group">
            {{range .tasks}}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center flex-grow-1 me-3">
                    {{if .Completed}}
                    <i class="bi bi-check-circle-fill text-success"></i>
                    {{else}}
                    <i class="bi bi-circle text-secondary"></i>
                    {{end}}
                    <span class="ms-2" {{if .Completed}} style="text-decoration: line-through;" {{end}}>{{.Title}}</span>
                    <input type="text" class="form-control ms-2 edit-input" value="{{.Title}}" id="edit-title-{{.ID}}" 
                           data-task-id="{{.ID}}" style="display: none;">
                </div>
                
                <div>
                    <button class="btn btn-sm btn-outline-primary edit-button">
                        <i class="bi bi-pencil"></i>
                    </button>
                    
                    <button class="btn btn-sm btn-outline-success save-button" style="display: none;" data-task-id="{{.ID}}">
                        <i class="bi bi-arrow-return-right"></i>
                    </button>
                    
                    <button class="btn btn-sm btn-outline-success toggle-complete-button" 
                            data-task-id="{{.ID}}" data-completed="{{.Completed}}">
                        {{if .Completed}}
                        <i class="bi bi-arrow-counterclockwise"></i>
                        {{else}}
                        <i class="bi bi-check-lg"></i>
                        {{end}}
                    </button>
                    
                    <button class="btn btn-sm btn-outline-danger delete-task-button" data-task-id="{{.ID}}">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </li>
            {{end}}
        </ul>

        <div class="mt-4">
          <form id="task-form" action="/task" method="POST" class="row g-3">
              <div class="col-auto">
                  <input type="text" class="form-control" name="title" placeholder="Add a new task" required>
              </div>
              <div class="col-auto">
                  <button type="submit" class="btn btn-primary">Add Task</button>
              </div>
          </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/tasks.js"></script>
</body>
</html>
