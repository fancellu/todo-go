<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" integrity="sha384-nWN3KqaaVcbEsCjLSV+2jMjh62Iny/+mN3srM8TZeM8N6aj7eDl5wwYggjAJ4/sJ" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                Task Details
            </div>
            <div class="card-body">
                <h5 class="card-title">
                    {{.task.Title}}
                </h5>
                <p class="card-text">
                    Status:
                    {{if .task.Completed}}
                        <i class="bi bi-check-circle-fill text-success"></i> Completed
                    {{else}}
                        <i class="bi bi-x-circle-fill text-danger"></i> Pending
                    {{end}}
                </p>
                <form action="/task/{{.task.ID}}" method="POST">
                    <input type="hidden" name="_method" value="PUT">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="Completed" id="completedCheckbox" {{if .task.Completed}}checked{{end}}>
                        <label class="form-check-label" for="completedCheckbox">
                            Mark as Completed
                        </label>
                    </div>
                </form>
                <a href="/" class="btn btn-secondary mt-3">Back to List</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
